# Render Blueprint: deploys the Django API as a free web service.
# In the Render dashboard: New > Blueprint > pick this repository.
services:
  - type: web
    name: weather-truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # A plan request can wait several seconds on the routing and weather APIs.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render creates a random secret; it never appears in the repo
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com # the leading dot allows any *.onrender.com host
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set in the dashboard to the Vercel URL once the frontend is live
      - key: HTTP_USER_AGENT
        value: WeatherAwareTruckRouting/1.0
      - key: HTTP_TIMEOUT_SECONDS
        value: "20"
